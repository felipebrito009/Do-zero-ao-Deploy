<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicFlow | Sua Biblioteca Musical</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="background-overlay"></div>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo-container">
            <h1>MusicFlow</h1>
            <p class="subtitle">Sua Biblioteca Musical</p>
        </div>
        <nav>
            <ul>
                <li class="active"><i class="fas fa-home"></i> Início</li>
                <li><i class="fas fa-heart"></i> Favoritos</li>
                <li><i class="fas fa-list"></i> Playlists</li>
                <li><i class="fas fa-compass"></i> Descobrir</li>
            </ul>
        </nav>
    </aside>

    <!-- Container principal -->
    <main class="container">
        <header>
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Buscar músicas...">
            </div>
            <div class="view-options">
                <button class="active"><i class="fas fa-th-large"></i> Grade</button>
                <button><i class="fas fa-list"></i> Lista</button>
            </div>
        </header>

        <section class="featured-section">
            <h2>Músicas em Destaque</h2>
            <div id="lista-de-musicas"></div>
        </section>
    </main>

    <!-- Player fixo -->
    <div class="player">
        <div class="now-playing">
            <img src="https://source.unsplash.com/random/50x50?music" alt="Capa atual">
            <div class="track-info">
                <h4>Selecione uma música</h4>
                <p>Artista</p>
            </div>
        </div>
        <div class="controls">
            <button><i class="fas fa-backward"></i></button>
            <button class="play-btn"><i class="fas fa-play"></i></button>
            <button><i class="fas fa-forward"></i></button>
        </div>
        <div class="volume">
            <i class="fas fa-volume-up"></i>
            <input type="range" min="0" max="100" value="50">
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
